name: iOS — Simulator smoke (launch screenshots + JS console)

# Diagnostic only — no signing, no TestFlight upload. Two jobs:
#
#   build  (macos-latest, Xcode 26 = the same toolchain as ios-build.yml)
#          → App.app for the simulator, uploaded as an artifact.
#   run    (xcode-27 image by default = iOS 27.0 simulator runtime)
#          → boots the requested iPad/iPhone + OS, launches GroundLog cold,
#            and captures what a fresh user (or an App Review tester) sees:
#            screenshots at intervals, the WebView's JS console (Capacitor
#            bridges console.* to stdout in Debug builds), the process os_log
#            stream, crash reports, and the app's own localStorage breadcrumbs
#            (gl_boot_log, gl_sw_log, gl_cam_log) read out of the simulator's
#            WebKit data store.
#
# Why two runners: apps linked against the iOS 27 SDK must adopt UIScene, and
# Capacitor 8.3.1 predates that. Building with Xcode 26 and RUNNING on the
# iOS 27 runtime is exactly what Apple did with build 169 (Xcode 26 SDK binary
# on an iPadOS 27.0 iPad Air) — so the smoke sees what the reviewer saw.
#
# Born 2026-09-14: App Review rejected build 169 under 2.1(a) — "error screen
# after we launched the app" on an iPad Air 11-inch (M3), iPadOS 27.0. No such
# device/OS exists in the house; this is how we get eyes on it.

on:
  workflow_dispatch:
    inputs:
      run_on:
        description: "Runner image for the RUN job (xcode-27 = iOS 27 sim; macos-latest = iOS 26 sim)"
        required: false
        default: "xcode-27"
        type: string
      device_type:
        description: "simctl device type name"
        required: false
        default: "iPad Air 11-inch (M4)"
        type: string
      ios_version:
        description: "Simulator runtime version prefix (e.g. 27.0, 26)"
        required: false
        default: "27"
        type: string
      settle_seconds:
        description: "Seconds to wait after launch before the first screenshot"
        required: false
        default: "25"
        type: string

concurrency:
  group: ios-sim-smoke
  cancel-in-progress: true

jobs:
  build:
    name: Build App.app for the simulator (Xcode 26, Debug, unsigned)
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - name: Checkout repo
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: "npm"

      - name: Install npm dependencies
        run: npm ci

      - name: Build web bundle
        env:
          NODE_OPTIONS: --max-old-space-size=6144
        run: npm run build

      - name: Sync Capacitor iOS
        run: npx cap sync ios

      - name: Select Xcode (same rule as ios-build.yml — pinned to 26 until Capacitor 8.5 + UIScene land)
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "^26.0"

      - name: Build for the simulator
        working-directory: ios/App
        run: |
          set -o pipefail
          xcodebuild -version
          xcodebuild \
            -project App.xcodeproj \
            -scheme App \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination "generic/platform=iOS Simulator" \
            -derivedDataPath "$RUNNER_TEMP/dd" \
            -skipPackagePluginValidation -skipMacroValidation \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build 2>&1 | tee "$RUNNER_TEMP/xcodebuild.log" | grep -E "error:|BUILD |Ld |Touch " | tail -30
          APP="$(find "$RUNNER_TEMP/dd/Build/Products" -maxdepth 2 -name 'App.app' -type d | head -1)"
          test -d "$APP"
          echo "Built: $APP"
          plutil -p "$APP/Info.plist" | grep -E 'DTSDKName|DTXcode|MinimumOSVersion|CFBundleVersion|CFBundleShortVersionString' || true
          mkdir -p "$RUNNER_TEMP/out"
          ditto -c -k --keepParent "$APP" "$RUNNER_TEMP/out/App.app.zip"
          ls -la "$RUNNER_TEMP/out"

      - name: Upload simulator app
        uses: actions/upload-artifact@v7
        with:
          name: sim-app-${{ github.run_number }}
          path: ${{ runner.temp }}/out/App.app.zip
          retention-days: 7

      - name: Upload xcodebuild log (on failure)
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: sim-xcodebuild-log-${{ github.run_number }}
          path: ${{ runner.temp }}/xcodebuild.log
          if-no-files-found: warn
          retention-days: 7

  run:
    name: Cold launch on ${{ inputs.device_type }} / iOS ${{ inputs.ios_version }}
    needs: build
    runs-on: ${{ inputs.run_on }}
    timeout-minutes: 30
    steps:
      - name: Download simulator app
        uses: actions/download-artifact@v7
        with:
          name: sim-app-${{ github.run_number }}
          path: ${{ runner.temp }}/in

      - name: Unpack
        run: |
          cd "$RUNNER_TEMP/in" && ditto -x -k App.app.zip .
          test -d "$RUNNER_TEMP/in/App.app"
          echo "APP_PATH=$RUNNER_TEMP/in/App.app" >> "$GITHUB_ENV"

      - name: Inventory Xcode + simulator runtimes on this runner
        run: |
          xcode-select -p; xcodebuild -version
          xcrun simctl list runtimes
          xcrun simctl list devicetypes | grep -i -E 'ipad|iphone 17' || true

      - name: Create + boot simulator
        run: |
          set -e
          RT_ID="$(xcrun simctl list runtimes -j | python3 -c '
          import json,sys
          want=sys.argv[1]
          rts=[r for r in json.load(sys.stdin)["runtimes"] if r.get("platform")=="iOS" and r.get("isAvailable") and r["version"].startswith(want)]
          rts.sort(key=lambda r:[int(x) for x in r["version"].split(".")])
          print(rts[-1]["identifier"] if rts else "")' "${{ inputs.ios_version }}")"
          if [ -z "$RT_ID" ]; then echo "::error::No iOS runtime matching '${{ inputs.ios_version }}'"; exit 1; fi
          echo "Runtime: $RT_ID"
          UDID="$(xcrun simctl create "smoke" "${{ inputs.device_type }}" "$RT_ID")"
          echo "UDID=$UDID" >> "$GITHUB_ENV"
          xcrun simctl boot "$UDID"
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl status_bar "$UDID" override --time "9:41" --batteryState charged --batteryLevel 100 --wifiBars 3 || true
          echo "Booted $UDID"

      - name: Install + cold launch with console capture
        run: |
          set -e
          OUT="$RUNNER_TEMP/smoke"; mkdir -p "$OUT/crashes"
          date +%s > "$OUT/t0"
          xcrun simctl install "$UDID" "$APP_PATH"
          # os_log stream: the app process + WebKit errors (WebContent process deaths etc.)
          xcrun simctl spawn "$UDID" log stream --style compact \
            --predicate 'process == "App" OR (subsystem CONTAINS "WebKit" AND messageType >= 16)' \
            > "$OUT/oslog.txt" 2>&1 &
          echo $! > "$OUT/oslog.pid"
          # stdout/stderr of the app = Capacitor's bridged JS console (Debug builds)
          xcrun simctl launch --console-pty "$UDID" io.groundlog.app > "$OUT/js-console.txt" 2>&1 &
          echo $! > "$OUT/launch.pid"
          sleep "${{ inputs.settle_seconds }}"
          xcrun simctl io "$UDID" screenshot "$OUT/01-launch-${{ inputs.settle_seconds }}s.png"
          sleep 20
          xcrun simctl io "$UDID" screenshot "$OUT/02-plus20s.png"
          sleep 20
          xcrun simctl io "$UDID" screenshot "$OUT/03-plus40s.png"
          echo "== app process:"
          xcrun simctl spawn "$UDID" launchctl list 2>/dev/null | grep -i -E 'groundlog|App$' || echo "(io.groundlog.app not in launchctl list)"
          find ~/Library/Logs/DiagnosticReports -type f -newer "$OUT/t0" \( -name '*.ips' -o -name '*.crash' \) -exec cp {} "$OUT/crashes/" \; 2>/dev/null || true
          ls -la "$OUT/crashes"

      - name: Pull localStorage breadcrumbs + WebKit data inventory
        if: always()
        run: |
          OUT="$RUNNER_TEMP/smoke"; mkdir -p "$OUT"
          C="$(xcrun simctl get_app_container "$UDID" io.groundlog.app data 2>/dev/null || true)"
          echo "container: $C"
          if [ -n "$C" ]; then
            (cd "$C" && find . -path '*WebsiteData*' -maxdepth 7 | head -80) > "$OUT/webkit-data-tree.txt" 2>&1 || true
            cat > "$RUNNER_TEMP/ls_dump.py" <<'PY'
          import os, sys, sqlite3
          root, out = sys.argv[1], sys.argv[2]
          hits = []
          for dp, dn, fn in os.walk(root):
              for f in fn:
                  # legacy <origin>.localstorage and the current WebKit layout
                  # (WebsiteData/Default/<hash>/LocalStorage/localstorage.sqlite3)
                  if f.endswith('.localstorage') or f == 'localstorage.sqlite3':
                      hits.append(os.path.join(dp, f))
          with open(out, 'w') as w:
              w.write('localstorage files: %d\n' % len(hits))
              for p in hits:
                  w.write('\n== %s\n' % p)
                  try:
                      con = sqlite3.connect(p)
                      for k, v in con.execute('select key, value from ItemTable'):
                          try:
                              s = v.decode('utf-16-le') if isinstance(v, (bytes, bytearray)) else str(v)
                          except Exception:
                              s = repr(v)[:2000]
                          if len(s) > 4000:
                              s = s[:4000] + '...'
                          w.write('%s = %s\n' % (k, s))
                  except Exception as e:
                      w.write('ERR %s\n' % e)
          PY
            python3 "$RUNNER_TEMP/ls_dump.py" "$C" "$OUT/localstorage.txt" || true
            head -c 6000 "$OUT/localstorage.txt" || true
          fi

      - name: Stop captures + show console
        if: always()
        run: |
          OUT="$RUNNER_TEMP/smoke"
          for p in launch oslog; do [ -f "$OUT/$p.pid" ] && kill "$(cat "$OUT/$p.pid")" 2>/dev/null || true; done
          echo "===== JS console (first 250 lines) ====="; head -250 "$OUT/js-console.txt" 2>/dev/null || true
          echo "===== os_log: errors / faults / crashes ====="; grep -E -i 'error|fault|crash|assert|terminat|exception|jetsam' "$OUT/oslog.txt" 2>/dev/null | head -100 || true
          xcrun simctl shutdown "$UDID" 2>/dev/null || true
          xcrun simctl delete "$UDID" 2>/dev/null || true

      - name: Upload smoke artifacts (screenshots, consoles, breadcrumbs, crashes)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: sim-smoke-${{ github.run_number }}-${{ inputs.ios_version }}
          path: ${{ runner.temp }}/smoke/
          if-no-files-found: warn
          retention-days: 14
